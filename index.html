    <style>
      @property --border-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }

      html {
        background-color: rgb(6, 0, 16) !important;
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: rgb(6, 0, 16) !important;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-x: none;
        -webkit-overscroll-behavior-x: none;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
      }

      #root {
        background-color: rgb(6, 0, 16) !important;
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        position: relative;
      }

      /* Unified text shadow for text content only */
      .text-shadow {
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8) !important;
      }

      /* Animated border light */
      .animated-border::before {
        content: '';
        position: absolute;
        inset: -2px;
        padding: 4px;
        background: conic-gradient(from var(--angle), transparent 50%, rgba(124,255,103,0.4) 65%, rgba(177,158,239,0.8) 70%, rgba(82,39,255,0.4) 75%, transparent 90%);
        border-radius: inherit;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        filter: blur(8px);
        box-shadow: 0 0 20px #60a5fa, 0 0 40px #a855f7, 0 0 60px #60a5fa;
        opacity: 0;
        animation: borderLight 4s linear infinite;
        transition: opacity 0.3s ease;
        z-index: -1;
      }

      .animated-border::after {
        content: '';
        position: absolute;
        inset: -30px;
        background: conic-gradient(from var(--angle), transparent 60%, rgba(124,255,103,0.3) 68%, rgba(177,158,239,0.6) 70%, rgba(82,39,255,0.3) 72%, transparent 80%);
        border-radius: 24px;
        mask:
          radial-gradient(ellipse at center, transparent 0%, transparent calc(100% - 30px), black calc(100% - 29px), black calc(100% - 1px), transparent 100%),
          linear-gradient(black, black);
        mask-composite: subtract;
        -webkit-mask-composite: subtract;
        filter: blur(40px);
        opacity: 0;
        animation: borderLight 4s linear infinite;
        transition: opacity 0.3s ease;
        z-index: -2;
      }

      .animated-border:hover::before,
      .animated-border:hover::after {
        opacity: 1;
      }

      /* Disable hover effects on mobile */
      @media (max-width: 768px) {
        .animated-border:hover::before,
        .animated-border:hover::after {
          opacity: 0 !important;
        }
      }

      @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }

      @keyframes borderLight {
        to {
          --angle: 360deg;
        }
      }
      

      /* Remove Recharts Focus Outline */
      .recharts-wrapper:focus,
      .recharts-surface:focus,
      .recharts-wrapper *:focus,
      .recharts-surface *:focus {
        outline: none !important;
        box-shadow: none !important;
      }

      .recharts-wrapper,
      .recharts-surface {
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #dadce0;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdc1c6;
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
