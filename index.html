    <style>
      :root {
        --paper-bg: #ffffff;
        --page-bg: #f8fafc;
        --ink-primary: #0f172a;
        --ink-secondary: #334155;
        --ink-muted: #64748b;
        --ink-faint: #94a3b8;
        --rule-border: #e2e8f0;
        --rule-subtle: #f1f5f9;
        
        /* Research chart palette (exact match with user reference) */
        --chart-ochre: #d97706;     /* Golden Amber/Ochre */
        --chart-teal: #0d9488;      /* University of Michigan Teal */
        --chart-dark: #0f172a;      /* Market Path Solid Black */
        --shade-green: rgba(16, 185, 129, 0.08); /* Analogue green zone */
        --shade-peach: rgba(244, 63, 94, 0.06);  /* Divergence/bear zone */
      }

      html {
        background-color: var(--page-bg) !important;
        height: 100%;
        overflow: hidden;
      }

      body {
        background-color: var(--page-bg) !important;
        color: var(--ink-primary);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
        height: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
      }

      #root {
        background-color: var(--page-bg) !important;
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        position: relative;
      }

      /* Institutional Report Surface Sheet */
      .report-sheet {
        background: #ffffff;
        border: 1px solid var(--rule-border);
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 10px 25px -5px rgba(15, 23, 42, 0.02);
      }

      .font-mono-numbers {
        font-family: 'JetBrains Mono', monospace;
        font-feature-settings: 'tnum' on, 'zero' on;
      }

      /* Clean Focus outline */
      .recharts-wrapper:focus,
      .recharts-surface:focus,
      .recharts-wrapper *:focus,
      .recharts-surface *:focus {
        outline: none !important;
        box-shadow: none !important;
      }

      /* Research Paper Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f8fafc;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
